{% extends "base.html" %}
{% block title %}Кіру — Bilim Al{% endblock %}

{% block auth_content %}
<div class="auth-page">
    <div class="auth-card">

        <div style="margin-bottom:24px">
            <div class="auth-title">Аккаунтқа кіру</div>
        </div>

        <div id="auth-error" class="alert alert-error hidden"></div>

        <div class="form-group">
            <label class="form-label">Пайдаланушы аты</label>
            <input type="text" id="username" placeholder="username">
        </div>
        <div class="form-group">
            <label class="form-label">Құпиясөз</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <div style="text-align:right; margin-top:-8px; margin-bottom:16px">
            <a href="/forgot-password"
               style="font-size:13px; color:var(--accent); font-weight:500">
                Құпиясөзді ұмыттыңыз ба?
            </a>
        </div>

        <button class="btn btn-primary btn-full" onclick="loginUser()">
            Кіру
        </button>

        <div class="auth-footer">
            Аккаунтыңыз жоқ па? <a href="/register">Тіркелу</a>
        </div>

    </div>
</div>
{% endblock %}
