{% extends "base.html" %}
{% block title %}AI көмекші — Bilim Al{% endblock %}
{% block page_title %}AI көмекші{% endblock %}

{% block content %}
<div class="card" style="padding:0; overflow:hidden; display:flex; flex-direction:column; height:calc(100vh - 56px - 4rem)">

    <!-- Хабарламалар -->
    <div class="chat-messages" id="chat-messages">
        <div class="message ai">
            <div class="message-avatar">🎓</div>
            <div class="message-bubble">
                Сәлем! Мен сенің Python бойынша AI көмекшіңмін. Кез келген сұрақ қой - код, қате, алгоритмдер туралы. Көмектесуге дайынмын! 😊
            </div>
        </div>
    </div>

    <!-- Жылдам сұрақтар -->
    <div style="padding:0.75rem 1.5rem; border-top:1px solid var(--border)">
        <div class="quick-prompts">
            <button class="quick-prompt" onclick="setQ('Что такое цикл for?')">for циклі дегеніміз не?</button>
            <button class="quick-prompt" onclick="setQ('Разница между list и tuple?')">List vs Tuple</button>
            <button class="quick-prompt" onclick="setQ('Как работает try/except?')">try/except қалай жұмыс істейді?</button>
            <button class="quick-prompt" onclick="setQ('Объясни lambda функции')">Lambda функциялары</button>
            <button class="quick-prompt" onclick="setQ('Что такое декоратор?')">Декораторлар</button>
        </div>
    </div>

    <!-- Енгізу -->
    <div class="chat-footer">
        <div class="chat-input-row">
            <textarea id="chat-input" class="chat-textarea" rows="1"
                placeholder="Сұрағыңызды қойыңыз... (Ctrl+Enter - жіберу)"
                onkeydown="handleChatKey(event)"
                oninput="autoResize(this)"></textarea>
            <button class="btn btn-primary" id="send-btn" onclick="sendMessage()"
                    style="align-self:flex-end; padding:0.55rem 1rem">
                →
            </button>
        </div>
    </div>

</div>

<script>
let chatHistory = [];

async function sendMessage() {
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg) return;

    addMsg('user', msg);
    input.value = '';
    autoResize(input);

    const btn = document.getElementById('send-btn');
    btn.disabled = true;

    const typingId = addTyping();

    try {
        const res = await fetch('/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, history: chatHistory.slice(-10) })
        });
        const data = await res.json();
        removeMsg(typingId);
        addMsg('ai', data.response);
        chatHistory.push({ role: 'user', content: msg });
        chatHistory.push({ role: 'assistant', content: data.response });
    } catch (e) {
        removeMsg(typingId);
        addMsg('ai', '❌ Байланыс қатесі');
    } finally {
        btn.disabled = false;
    }
}

function addMsg(role, text) {
    const box = document.getElementById('chat-messages');
    const id = 'msg-' + Date.now();
    const div = document.createElement('div');
    div.id = id;
    div.className = `message ${role}`;
    div.innerHTML = `
        <div class="message-avatar">${role === 'user' ? '👤' : '🎓'}</div>
        <div class="message-bubble">${formatMsg(text)}</div>
    `;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return id;
}

function addTyping() {
    const box = document.getElementById('chat-messages');
    const id = 'typing-' + Date.now();
    const div = document.createElement('div');
    div.id = id;
    div.className = 'message ai';
    div.innerHTML = `
        <div class="message-avatar">🎓</div>
        <div class="message-bubble">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>
    `;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return id;
}

function removeMsg(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

function formatMsg(text) {
    text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g,
        (_, lang, code) => `<pre><code>${esc(code.trim())}</code></pre>`);
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\n/g, '<br>');
    return text;
}

function esc(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setQ(q) {
    document.getElementById('chat-input').value = q;
    sendMessage();
}

function handleChatKey(e) {
    if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}
</script>
{% endblock %}
