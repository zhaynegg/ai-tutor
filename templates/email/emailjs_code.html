<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 20px; color: #0f172a;">
  <h1 style="font-size: 24px; margin: 0 0 24px;">Bilim Al</h1>
  <h2 style="font-size: 20px; margin: 0 0 16px;">{{title}}</h2>
  <p>Привет, {{username}}!</p>
  <p>{{message}}</p>
  <div style="background: #f8fafc; border: 2px solid #2563eb; border-radius: 12px; padding: 24px; text-align: center; margin: 24px 0;">
    <span style="font-family: monospace; font-size: 36px; font-weight: bold; letter-spacing: 6px; color: #2563eb;">{{code}}</span>
  </div>
  <p style="color: #64748b; font-size: 14px;">Код действителен {{expires_minutes}} минут.</p>
  <p style="color: #64748b; font-size: 14px;">Если вы не запрашивали этот код, проигнорируйте письмо.</p>
</div>
